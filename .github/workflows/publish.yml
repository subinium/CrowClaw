name: publish

on:
  release:
    types: [published]
  # Manual re-trigger when a release was tagged but the publish run failed
  # (e.g. transient CI test flake, npm registry blip). Pass the tag to
  # republish via the `tag` input. Defaults to whatever ref the workflow
  # was kicked from.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to repo's latest release)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Publish the umbrella `crowclaw` package only. Workspace members
      # (`@crowclaw/*`) are kept un-published — `crowclaw` ships every
      # workspace's `dist/` via the root package's `files: ["packages/*/dist"]`
      # so `npm install crowclaw` gets the entire runtime in one shot.
      # Library consumers who want individual subpath imports can deep-import
      # via `crowclaw/packages/<name>/dist/index.js` from the umbrella tarball.
      # `--ignore-scripts` skips the workspace `link-workspaces.mjs` postinstall
      # which expects a checkout layout, not a fresh tarball.
      - name: Publish (crowclaw umbrella)
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
