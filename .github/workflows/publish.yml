name: publish

on:
  release:
    types: [published]
  # Manual re-trigger when a release was tagged but the publish run failed
  # (e.g. transient CI test flake, npm registry blip). Pass the tag to
  # republish via the `tag` input. Defaults to whatever ref the workflow
  # was kicked from.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to repo's latest release)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Publish each `@crowclaw/*` workspace package independently so library
      # users can `npm install @crowclaw/core` etc. The `@crowclaw` npm org
      # was registered manually before this workflow first ran successfully —
      # creating an npm org is a web-UI-only action and not scriptable.
      # `--ignore-scripts` skips the workspace `link-workspaces.mjs`
      # postinstall (it expects a checkout layout, not a fresh tarball).
      - name: Publish workspaces (@crowclaw/*)
        run: npm publish --workspaces --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the umbrella `crowclaw` package (CLI + bundled workspace dist
      # via root `files: ["packages/*/dist", ...]`). Same `--ignore-scripts`
      # rationale.
      - name: Publish root (crowclaw)
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
