name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=verbose 2>&1 | tee test-output.txt

      - name: Docker smoke
        run: |
          docker build -t crowclaw-ci .
          cid=$(docker run -d -p 8787:8787 --name crowclaw-ci -e CROWCLAW_DASHBOARD_TOKEN=ci-smoke-token crowclaw-ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if ! docker ps --format '{{.ID}}' | grep -q "^$cid"; then
              docker logs "$cid" || true
              docker ps -a
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8787/healthz; then
              docker stop --time 10 "$cid"
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid" || true
          docker ps -a
          exit 1

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          PASS=$(grep -c "✓" test-output.txt || echo "0")
          FAIL=$(grep -c "✗\|×" test-output.txt || echo "0")
          TOTAL=$((PASS + FAIL))
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
